# LLM provider and model configuration for NSE corporate data analysis.
# API keys are read from environment (config/api_keys.env or .env).
# See docs/llms_setup.md for required env vars per provider.

default_model: "gpt-4o-mini"
fallback_model: "gpt-3.5-turbo"

# Models available for use (model string as used by LiteLLM).
# Set the corresponding API key in config/api_keys.env to enable each provider.
models:
  - "openai/gpt-4o-mini"
  - "openai/gpt-4o"
  - "openai/gpt-3.5-turbo"
  - "anthropic/claude-3-5-sonnet-20241022"
  - "anthropic/claude-3-haiku-20240307"

# Model roles for NSE analysis (optional: use different models per task).
analysis:
  summarization_model: "openai/gpt-4o-mini"
  classification_model: "openai/gpt-4o-mini"
  extraction_model: "openai/gpt-4o-mini"
